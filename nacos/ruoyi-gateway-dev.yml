spring:
  data:
    redis:
      host: localhost
      port: 6379
      password: 
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              lowerCaseServiceId: true
              enabled: true
          routes:
            # 认证中心
            - id: ruoyi-auth
              uri: lb://ruoyi-auth
              predicates:
                - Path=/auth/**
              filters:
                # 验证码处理
                - name: CacheRequestBody
                  args:
                    bodyClass: java.lang.String
                - ValidateCodeFilter
                - StripPrefix=1
            # 代码生成
            - id: ruoyi-gen
              uri: lb://ruoyi-gen
              predicates:
                - Path=/code/**
              filters:
                - StripPrefix=1
            # 定时任务
            - id: ruoyi-job
              uri: lb://ruoyi-job
              predicates:
                - Path=/schedule/**
              filters:
                - StripPrefix=1
            # ERP 基础资料
            - id: ruoyi-erp-base
              uri: lb://ruoyi-erp-base
              predicates:
                - Path=/erp/material/**,/erp/supplier/**,/erp/customer/**,/erp/warehouse/**
              filters:
                - StripPrefix=1
            # ERP 采购
            - id: ruoyi-erp-purchase
              uri: lb://ruoyi-erp-purchase
              predicates:
                - Path=/erp/purchase/**
              filters:
                - StripPrefix=1
            # ERP 销售
            - id: ruoyi-erp-sale
              uri: lb://ruoyi-erp-sale
              predicates:
                - Path=/erp/sale/**
              filters:
                - StripPrefix=1
            # ERP 库存
            - id: ruoyi-erp-stock
              uri: lb://ruoyi-erp-stock
              predicates:
                - Path=/erp/stock/**
              filters:
                - StripPrefix=1
            # ERP 财务
            - id: ruoyi-erp-finance
              uri: lb://ruoyi-erp-finance
              predicates:
                - Path=/erp/finance/**
              filters:
                - StripPrefix=1
            # ERP 生产
            - id: ruoyi-erp-production
              uri: lb://ruoyi-erp-production
              predicates:
                - Path=/erp/production/**
              filters:
                - StripPrefix=1
            # ERP 报表 + 工作台待办
            - id: ruoyi-erp-report
              uri: lb://ruoyi-erp-report
              predicates:
                - Path=/erp/report/**,/erp/order/**
              filters:
                - StripPrefix=1
            - id: ruoyi-system
              uri: lb://ruoyi-system
              predicates:
                - Path=/system/**
              filters:
                - StripPrefix=1
            # 文件服务
            - id: ruoyi-file
              uri: lb://ruoyi-file
              predicates:
                - Path=/file/**
              filters:
                - StripPrefix=1

# 安全配置
security:
  # 验证码
  captcha:
    enabled: false
    type: math
  # 防止XSS攻击
  xss:
    enabled: true
    excludeUrls:
      - /system/notice

  # 不校验白名单
  ignore:
    whites:
      - /auth/logout
      - /auth/login
      - /auth/register
      - /code
      - /*/v2/api-docs
      - /*/v3/api-docs
      - /csrf

# springdoc配置
springdoc:
  webjars:
    # 访问前缀
    prefix:
